name: NOVA-BLOCKS CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  npm_config_audit: 'true'
  npm_config_audit_level: 'high'

jobs:
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nova_blocks/frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            nova_blocks/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('nova_blocks/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests
        run: npm test -- --watchAll=false --coverage=false
        env:
          CI: true
      - name: Run E2E Tests with Playwright
        run: npm run test:e2e:ci
        env:
          CI: true
          PLAYWRIGHT_TEST_TIMEOUT: 120000
  backend:
    name: Backend API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nova_blocks/backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            nova_blocks/backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('nova_blocks/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Verify Environment Variables
        run: |
          echo "Checking required env vars..."
          required_vars=("JWT_SECRET" "MONGODB_URI" "ALLOWED_ORIGINS")
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "⚠️  WARNING: $var is not set"
            else
              echo "✅ $var is set"
            fi
          done
      - name: Run Backend Jest Tests
        run: npm test
        env:
          CI: true
          JWT_SECRET: test-jwt-secret-key
          MONGODB_URI: mongodb://localhost:27017/nova-blocks-test
          ALLOWED_ORIGINS: "http://localhost:3000"
      - name: Run npm Audit
        run: npm audit --audit-level=high
        env:
          CI: true
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    environment:
      name: production
      url: https://nova-blocks.example.com
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            nova_blocks/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('nova_blocks/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Configure Deployment Secrets
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "✅ Deployment secrets configured"
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_HUB_USERNAME }}/${{ github.repository }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/${{ github.repository }}:cache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/${{ github.repository }}:cache,mode=max
      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          path: ./nova_blocks
      - name: Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            cd ./nova_blocks
            docker pull ${{ env.DOCKER_HUB_USERNAME }}/${{ github.repository }}:${{ github.sha }}
            docker stop nova-blocks || true
            docker rm nova-blocks || true
            docker run -d \
              --name nova-blocks \
              -p 5000:5000 \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e MONGODB_URI=${{ secrets.MONGODB_URI }} \
              -e ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }} \
              ${{ env.DOCKER_HUB_USERNAME }}/${{ github.repository }}:${{ github.sha }}
  quality-gates:
    name: Quality Gates & Enforcement
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    needs: [frontend, backend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION || '20' }}
      - name: Check Code Formatting (ESLint)
        run: npx eslint .
        env:
          CI: true
      - name: Enforce Test Coverage
        run: |
          echo "Checking test coverage thresholds..."
          frontend_coverage=$(npm run coverage 2>&1 || echo "0")
          echo "Frontend coverage: $frontend_coverage%"
          backend_coverage=$(npx jest --collectCoverageFrom='./**/*.js' --showCoverageTotal 2>&1 | grep -o '[0-9]*\.[0-9]*%' || echo "0%")
          echo "Backend coverage: $backend_coverage"
      - name: Fail on High Severity Vulnerabilities
        run: npm audit --audit-level=high --json | npm audit-ci-check || exit 1
  post-deploy:
    name: Post-Deploy Validation
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION || '20' }}
      - name: Run Smoke Tests
        run: |
          echo "Running post-deployment smoke tests..."
          curl -f http://localhost:5000/api/gpu/health || echo "⚠️  API health check failed"
          curl -f http://localhost:3000/ || echo "⚠️  Frontend health check failed"
      - name: Notify Team
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          message: |
            :warning: *NOVA-BLOCKS CI/CD Pipeline Failed*
            
            *Workflow:* `${{ github.workflow }}`
            *Branch:* `${{ github.ref_name }}`
            *Job:* `${{ github.job }}`
            *Run:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Generate Final Report
        run: |
echo "=== CI/CD Pipeline Summary ==="
echo "✅ Frontend Tests: $([[ $(npm run test:e2e 2>&1 | tail -1) == *'0 failing'* ]] && echo 'PASSED' || echo 'FAILED')"
echo "✅ Backend Tests: $([[ $(npm test 2>&1 | tail -1) == *'OK'* ]] && echo 'PASSED' || echo 'FAILED')"
echo "✅ Code Quality: $([ $(npx eslint . --max-warnings=0 2>&1) ] && echo 'PASSED' || echo 'FAILED')"
echo "✅ Security Scan: $([ $(npm audit --audit-level=high 2>&1) ] && echo 'PASSED' || echo 'FAILED')"